name: Sensitive file guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reject-tracked-dumps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail on tracked database dumps or private env/credential files
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          dump = re.compile(r"(^|/)(backup_[^/]*\.sql|[^/]*\.(?:dump|backup|bak|sql\.gz|sql\.zip))$", re.I)
          env = re.compile(r"(^|/)\.env(?:\.[^/]+)?$", re.I)
          credential = re.compile(r"(^|/)(?:fcm|gcp|firebase|service-account)[-_]credentials\.json$", re.I)

          bad = [
              path for path in tracked if path and (
                  dump.search(path)
                  or (env.search(path) and not path.endswith(".example"))
                  or credential.search(path)
              )
          ]
          if bad:
              print("Sensitive files tracked in Git. Remove and rotate exposed credentials:")
              for path in bad:
                  print(" -", path)
              sys.exit(1)
          print("No prohibited tracked dump/env/credential paths found.")
          PY
      - name: Assert private Compose networks and loopback-only host bindings
        env:
          JWT_SECRET: ci-placeholder-not-a-real-key
          SPRING_DATASOURCE_PASSWORD: ci-placeholder
          SPRING_RABBITMQ_PASSWORD: ci-placeholder
          RATE_LIMIT_REDIS_PASSWORD: ci-placeholder
          GF_SECURITY_ADMIN_PASSWORD: ci-placeholder
        run: |
          python3 -m unittest discover -s docker -p 'test_verify_vh106_exposure.py'
          python3 docker/verify-vh106-exposure.py --config-only

  registration-security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: gradle
          cache-dependency-path: 'backend/**/*.gradle*'
      - name: Run backend regression tests and business coverage
        run: |
          chmod +x gradlew
          ./gradlew test jacocoTestReport --no-daemon
      - name: Upload backend JUnit and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/build/test-results/test/*.xml
            backend/build/reports/tests/test/**
            backend/build/reports/jacoco/test/**
          if-no-files-found: warn
          retention-days: 14
