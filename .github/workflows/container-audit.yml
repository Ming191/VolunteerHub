name: Container audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: container-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: backend-image-audit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runnable backend image (separate from unit tests)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: volunteerhub-backend:ci
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
      - name: Report high and critical image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0, pinned after 2026 supply-chain remediation
        with:
          version: v0.76.0
          image-ref: volunteerhub-backend:ci
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          # Audit-only until existing findings are remediated in VH-301.
          exit-code: '0'
