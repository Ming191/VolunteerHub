name: Dependency review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fail on newly introduced high or critical vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Enforce only new dependency risk, not historic advisories.
