# Disposable test infrastructure only. JWT_SECRET is generated by tests.
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mypassword}
spring.mail.username=${SPRING_MAIL_USERNAME:test@example.invalid}
spring.mail.password=${SPRING_MAIL_PASSWORD:test-only-not-a-credential}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:myuser}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:mypassword}
storage.access-key=${STORAGE_ACCESS_KEY:test-local-access}
storage.secret-key=${STORAGE_SECRET_KEY:test-local-secret}
auth.refresh-cookie.secure=false
# Prevent a fixed management port from conflicting between parallel Spring tests.
management.server.port=-1
