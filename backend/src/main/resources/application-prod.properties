# Production requires externally injected values; no local credentials or endpoints.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.password=${RATE_LIMIT_REDIS_PASSWORD}
rate-limit.redis.host=${SPRING_DATA_REDIS_HOST}
rate-limit.redis.password=${RATE_LIMIT_REDIS_PASSWORD}
storage.bootstrap-bucket=false
storage.endpoint=${STORAGE_ENDPOINT}
storage.presign-endpoint=${STORAGE_PRESIGN_ENDPOINT}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL}
storage.bucket=${STORAGE_BUCKET}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
app.frontend-url=${APP_FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS}
auth.refresh-cookie.secure=true
