# Local-only SigV4 reverse proxy: browsers call localhost:9000;
# the private RustFS server stays behind Docker networking.
map $http_origin $local_cors_origin {
    default "";
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
    "http://localhost:3000" $http_origin;
    "http://127.0.0.1:3000" $http_origin;
}
server {
    listen 9000;
    server_name _;
    client_max_body_size 10m;
    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $local_cors_origin always;
            add_header Access-Control-Allow-Methods "PUT, GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, If-None-Match" always;
            add_header Access-Control-Max-Age "600" always;
            add_header Vary "Origin" always;
            return 204;
        }
        proxy_pass http://rustfs:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        add_header Access-Control-Allow-Origin $local_cors_origin always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Vary "Origin" always;
    }
}
