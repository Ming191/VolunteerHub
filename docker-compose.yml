services:
  postgres-db:
    image: postgres:15-alpine

    container_name: volunteerhub_postgres

    labels:
      logging: "promtail"

    environment:
      - POSTGRES_USER=${SPRING_DATASOURCE_USERNAME:-vh_local}
      - POSTGRES_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Set a unique SPRING_DATASOURCE_PASSWORD}
      - POSTGRES_DB=volunteerhub
      # PostgreSQL performance tuning
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=8MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"
      - "-c"
      - "max_connections=100"

    networks:
      - data
    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always

  # LOCAL development only. Private S3-compatible storage; no cloud account.
  rustfs:
    image: rustfs/rustfs:latest
    command: ["/data"]
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - data
      - edge
    environment:
      RUSTFS_ACCESS_KEY: ${LOCAL_STORAGE_ACCESS_KEY:-localdevaccess}
      RUSTFS_SECRET_KEY: ${LOCAL_STORAGE_SECRET_KEY:-localdevsecret123}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000"
    volumes:
      - rustfs_data:/data
    restart: unless-stopped

  # Local browser-facing S3 signed PUT endpoint. Handles CORS and enforces 10 MiB
  # before requests can reach the private RustFS bucket.
  storage-proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - data
      - edge
    volumes:
      - ./docker/storage-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rustfs
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: volunteerhub_backend
    labels:
      logging: "promtail"
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - data
      - observability
      - edge
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/volunteerhub
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-vh_local}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Set a unique SPRING_DATASOURCE_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=${SPRING_RABBITMQ_USERNAME:-vh_local}
      - SPRING_RABBITMQ_PASSWORD=${SPRING_RABBITMQ_PASSWORD:?Set a unique SPRING_RABBITMQ_PASSWORD}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${RATE_LIMIT_REDIS_PASSWORD:?Set a unique RATE_LIMIT_REDIS_PASSWORD}
      - RATE_LIMIT_REDIS_PASSWORD=${RATE_LIMIT_REDIS_PASSWORD:?Set a unique RATE_LIMIT_REDIS_PASSWORD}
      # Spring Actuator listens on an internal port, never published on the host.
      - MANAGEMENT_SERVER_PORT=8081
      - MANAGEMENT_SERVER_ADDRESS=0.0.0.0
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=user@example.com
      - SPRING_MAIL_PASSWORD=xxxx xxxx xxxx xxxx
      - PROMETHEUS_URL=http://prometheus:9090
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET before running Docker Compose}
      # This Compose stack serves HTTP on loopback only. TLS deployments keep Secure=true.
      - AUTH_COOKIE_SECURE=false
      # One-time opt-in when adopting a verified legacy database; disabled otherwise.
      - VH_FLYWAY_BASELINE_ON_MIGRATE=${VH_FLYWAY_BASELINE_ON_MIGRATE:-false}
      - STORAGE_ENDPOINT=http://rustfs:9000
      - STORAGE_PRESIGN_ENDPOINT=http://localhost:9000
      - STORAGE_PUBLIC_BASE_URL=http://localhost:8080
      - STORAGE_BUCKET=volunteerhub
      - STORAGE_ACCESS_KEY=${LOCAL_STORAGE_ACCESS_KEY:-localdevaccess}
      - STORAGE_SECRET_KEY=${LOCAL_STORAGE_SECRET_KEY:-localdevsecret123}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_JPA_SHOW_SQL=false
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    depends_on:
      - postgres-db
      - rabbitmq
      - redis
      - rustfs
      - storage-proxy
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: volunteerhub_rabbitmq
    labels:
      logging: "promtail"
    networks:
      - data
      - observability
    environment:
      - RABBITMQ_DEFAULT_USER=${SPRING_RABBITMQ_USERNAME:-vh_local}
      - RABBITMQ_DEFAULT_PASS=${SPRING_RABBITMQ_PASSWORD:?Set a unique SPRING_RABBITMQ_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: always

  redis:
    image: redis:7-alpine
    container_name: volunteerhub_redis
    labels:
      logging: "promtail"
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "60", "1000", "--requirepass", "${RATE_LIMIT_REDIS_PASSWORD:?Set a unique RATE_LIMIT_REDIS_PASSWORD}"]
    networks:
      - data
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: volunteerhub_prometheus
    networks:
      - observability
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: volunteerhub_grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - observability
      - edge
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?Set a unique GF_SECURITY_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PUBLIC_DASHBOARDS_ENABLED=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    restart: always

  loki:
    image: grafana/loki:3.0.0
    container_name: volunteerhub_loki
    networks:
      - observability
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    restart: always

  tempo:
    image: grafana/tempo:2.6.0
    container_name: volunteerhub_tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo-config.yml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    networks:
      - observability
    restart: always

  promtail:
    image: grafana/promtail:3.0.0
    container_name: volunteerhub_promtail
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - observability

    command: -config.file=/etc/promtail/promtail-config.yml
    depends_on:
      - loki
    restart: always

networks:
  # Internal networks cannot be reached directly from outside Docker.
  data:
    internal: true
  observability:
    internal: true
  # Only the API, local storage proxy and Grafana need outbound access/loopback UI.
  edge:

volumes:
  rustfs_data:
    driver: local
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local
  tempo_data:
    driver: local
